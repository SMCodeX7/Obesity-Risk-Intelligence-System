[client]
toolbarMode = "minimal"

[theme]
base = "light"

primaryColor = "#2563EB"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#F1F5F9"
textColor = "#0F172A"
linkColor = "#2563EB"

borderColor = "#E2E8F0"
dataframeBorderColor = "#E2E8F0"
dataframeHeaderBackgroundColor = "#EFF6FF"

baseRadius = "full"
buttonRadius = "full"

showWidgetBorder = true
showSidebarBorder = true

font = "sans-serif"
headingFont = "sans-serif"

chartCategoricalColors = [
    "#2563EB",
    "#0F8B8D",
    "#38BDF8",
    "#14B8A6",
    "#6366F1",
    "#8B5CF6",
    "#64748B"
]

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F8FAFC"
primaryColor = "#2563EB"
textColor = "#0F172A"
borderColor = "#E2E8F0"
showWidgetBorder = true